name: Build SSA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ "v*" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win_x64
          - os: ubuntu-22.04
            platform: lin_x64
          - os: macos-14
            platform: mac_x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Download X-Plane SDK 4.3.0
        shell: bash
        run: |
          curl -L -o sdk.zip https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK430.zip
          unzip -q sdk.zip -d sdk
      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [[ "${{ runner.os }}" == "macOS" ]]; then EXTRA="-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DXPLANE_SDK_ROOT="$PWD/sdk/SDK" $EXTRA
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Stage package
        shell: bash
        run: |
          mkdir -p package/SSA/${{ matrix.platform }} package/SSA/config
          FILE=$(find build -name 'SSA.xpl' -o -name 'SSA.dll' -o -name 'libSSA.*' | head -1)
          cp "$FILE" package/SSA/${{ matrix.platform }}/SSA.xpl
          cp examples/ssa.json package/SSA/config/example-ssa.json
          cp README.md AUTHORING.md package/SSA/
      - uses: actions/upload-artifact@v4
        with:
          name: SSA-${{ matrix.platform }}
          path: package/SSA

